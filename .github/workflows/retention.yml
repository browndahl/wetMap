name: Retired nowcast image cleanup
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Permanently delete only approved derived WebP images older than 48h
        type: boolean
        default: false
      max_delete:
        description: Explicit upper deletion budget after reviewing dry-run report
        default: "50000"
concurrency:
  group: nowcast-image-retention
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e apps/worker
      - name: Review or retire precisely allow-listed images
        run: |
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python -m wetmap_worker.retention --report retention-report.json --max-delete "$MAX_DELETE" "${args[@]}"
        env:
          APPLY: ${{ inputs.apply }}
          MAX_DELETE: ${{ inputs.max_delete }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          {
            name: retention-report,
            path: retention-report.json,
            retention-days: 7,
          }
