name: Synthetic uptime
on:
  schedule:
    # Avoid GitHub's busiest quarter-hour boundaries.
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-radar:
    uses: ./.github/workflows/radar.yml
    secrets: inherit
  probe:
    needs: refresh-radar
    if: always() && vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check web application
        run: curl --fail --retry 2 --retry-all-errors --max-time 15 "$PUBLIC_URL/"
        env: { PUBLIC_URL: "${{ vars.PUBLIC_URL }}" }
      - name: Check API health
        run: curl --fail --retry 2 --retry-all-errors --max-time 15 "$API_URL/health/live"
        env: { API_URL: "${{ vars.API_URL }}" }
      - name: Download radar metadata
        run: curl --fail --retry 2 --retry-all-errors --max-time 15 "$API_URL/api/v1/radar/frames" -o frames.json
        env: { API_URL: "${{ vars.API_URL }}" }
      - name: Validate radar freshness
        run: python .github/scripts/check_freshness.py frames.json 30
      - name: Download nowcast quality report
        run: curl --fail --retry 2 --retry-all-errors --max-time 15 "$API_URL/api/v1/radar/nowcast/quality" -o quality.json
        env: { API_URL: "${{ vars.API_URL }}" }
      - name: Validate nowcast quality contract
        run: python .github/scripts/check_nowcast_quality.py quality.json
      - name: Validate live point performance and cache
        run: python .github/scripts/check_live_performance.py "$API_URL"
        env: { API_URL: "${{ vars.API_URL }}" }
