name: Synthetic uptime
on:
  schedule:
    # Avoid GitHub's busiest quarter-hour boundaries.
    - cron: "6,21,36,51 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: vars.PUBLIC_URL != '' && vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Probe every surface, record heartbeat and notify incident transitions
        run: python .github/scripts/operations_probe.py
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          API_URL: ${{ vars.API_URL }}
          MONITOR_REPORT_TOKEN: ${{ secrets.MONITOR_REPORT_TOKEN }}
