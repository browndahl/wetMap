name: Synthetic uptime
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: vars.PUBLIC_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: curl --fail --retry 2 --max-time 15 "$PUBLIC_URL/"
        env: { PUBLIC_URL: "${{ vars.PUBLIC_URL }}" }
      - run: curl --fail --retry 2 --max-time 15 "$API_URL/health/live"
        env: { API_URL: "${{ vars.API_URL }}" }
      - run: curl --fail --retry 2 --max-time 15 "$API_URL/api/v1/radar/frames" -o frames.json
        env: { API_URL: "${{ vars.API_URL }}" }
      - run: python .github/scripts/check_freshness.py frames.json 15
