[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wetmap-worker"
version = "0.1.0"
description = "Idempotent DMI ODIM HDF5 radar frame processor"
requires-python = ">=3.12"
dependencies = [
  "boto3==1.40.58",
  "h5py==3.14.0",
  "numpy==2.5.3",
  "Pillow==11.3.0",
  "opencv-python-headless==4.12.0.88",
  "pyproj==3.7.2",
  "rasterio==1.5.2",
  "requests==2.32.5"
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
wetmap-worker = "wetmap_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
