name: wetmap
services:
  worker:
    build:
      context: apps/worker
    environment:
      DMI_BASE_URL: ${DMI_BASE_URL:-https://opendataapi.dmi.dk}
    volumes:
      - radar-data:/data/frames
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: apps/api
    environment:
      Storage__FramesDirectory: /data/frames
      Dmi__BaseUrl: ${DMI_BASE_URL:-https://opendataapi.dmi.dk}
      AllowedOrigins: http://localhost:5173,http://localhost:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    volumes:
      - radar-data:/data/frames:ro
    ports:
      - "8081:8080"
    depends_on:
      worker:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=4m
    security_opt:
      - no-new-privileges:true

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
    security_opt:
      - no-new-privileges:true

volumes:
  radar-data:
