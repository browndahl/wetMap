name = "wetmap-api"
main = "src/index.ts"
compatibility_date = "2026-09-20"
workers_dev = true

[[r2_buckets]]
binding = "RADAR"
bucket_name = "wetmap-radar"
preview_bucket_name = "wetmap-radar-preview"

[vars]
DMI_BASE_URL = "https://opendataapi.dmi.dk"
OPEN_METEO_BASE_URL = "https://api.open-meteo.com"
GEOCODER_BASE_URL = "https://photon.komoot.io"
ALLOWED_ORIGIN = "https://wetmap.pages.dev,https://wetmap-staging.pages.dev"
GITHUB_REPOSITORY = "browndahl/wetMap"
GITHUB_RADAR_WORKFLOW = "radar.yml"
GITHUB_REF = "main"

[triggers]
crons = ["1-59/5 * * * *"]

[observability.logs]
enabled = true
invocation_logs = true
