openapi: 3.1.0
info:
  title: WetMap API
  version: 1.0.0
  description: API responses based on DMI data always include processing attribution and fetch time.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/radar/frames:
    get:
      operationId: getRadarFrames
      summary: Lists processed radar reflectivity frames
      responses:
        "200":
          description: Current frame manifest
          headers:
            ETag: { schema: { type: string } }
            X-DMI-Attribution:
              description: UTF-8 percent-encoded DMI processing attribution; the JSON body contains the display value.
              schema: { type: string }
            X-Data-Fetched-At: { schema: { type: string, format: date-time } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarManifest" }
        "304": { description: Not modified }
  /api/v1/radar/nowcast:
    get:
      operationId: getRadarNowcast
      summary: Lists optical-flow radar extrapolations up to 60 minutes
      description: Derived from recent observations; frames are predictions, not future measurements.
      responses:
        "200":
          description: Current nowcast manifest, or an empty manifest when unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NowcastManifest" }
        "304": { description: Not modified }
  /api/v1/radar/nowcast/quality:
    get:
      operationId: getRadarNowcastQuality
      summary: Returns rolling verification of earlier nowcasts against observations
      description: Scores every available 5–60 minute horizon at 5, 10, 15, 20 and 35 dBZ after the predicted timestamp becomes observable, compares against persistence, and includes a separate raw DMI rain-gauge calibration when available.
      responses:
        "200":
          description: Rolling verification metrics, or an empty result before the first comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NowcastQuality" }
        "304": { description: Not modified }
  /api/v1/radar/nowcast/observatory:
    get:
      operationId: getPrecisionObservatory
      summary: Returns the compact operational precision dashboard
      description: Groups verification into honest +15, +30, +45 and +60 minute windows, distinguishes dry-weather collection from rain-event evidence, and omits raw verification history.
      responses:
        "200":
          description: Current operational precision assessment
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/PrecisionObservatoryResponse" }
        "304": { description: Not modified }
  /api/v1/push/config:
    get:
      operationId: getPushConfig
      summary: Returns Web Push availability and the public VAPID key
      responses:
        "200":
          description: Public push configuration
          content:
            application/json:
              schema:
                type: object
                required: [available, publicKey]
                properties:
                  available: { type: boolean }
                  publicKey: { type: [string, "null"] }
  /api/v1/push/subscriptions:
    post:
      operationId: savePushSubscription
      summary: Stores or updates an explicitly authorized background rain alert
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        "200": { description: Existing subscription updated }
        "201": { description: Subscription created }
        "400": { description: Invalid subscription or coordinates }
        "403": { description: Origin is not allowed }
        "503": { description: Web Push is not configured }
    delete:
      operationId: deletePushSubscription
      summary: Deletes a background rain alert subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "204": { description: Subscription deleted or already absent }
        "400": { description: Invalid endpoint }
        "403": { description: Origin is not allowed }
  /api/v1/weather/forecast:
    get:
      operationId: getForecast
      summary: Returns a DMI HARMONIE point forecast
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForecastResponse" }
        "400":
          description: Invalid coordinates
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/v1/weather/precipitation:
    get:
      operationId: getNextHourPrecipitation
      summary: Returns radar-anchored next-hour precipitation estimates
      description: Near-term intervals use the same DMI radar and optical-flow nowcast as the map. HARMONIE is used per interval when fresh radar coverage is unavailable.
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Four quarter-hour precipitation estimates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RainNextHourResponse" }
        "400":
          description: Invalid coordinates
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "503":
          description: Forecast provider unavailable and no valid persisted estimate exists
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/v1/locations/search:
    get:
      operationId: searchLocations
      summary: Searches Danish cities and addresses
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: lat
          in: query
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Denmark-filtered location matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationSearchResponse" }
        "400":
          description: Invalid query
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "503":
          description: Location provider unavailable
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/v1/locations/reverse:
    get:
      operationId: reverseLocation
      summary: Resolves Danish coordinates to a place or address
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: 54.4, maximum: 58 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: 7.5, maximum: 15.5 }
      responses:
        "200":
          description: Resolved location
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationResult" }
        "400":
          description: Coordinates outside Denmark
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "503":
          description: Location provider unavailable
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
components:
  schemas:
    RadarFrame:
      type: object
      required: [id, observedAt, fetchedAt, url, bounds, product, unit, sha256]
      properties:
        id: { type: string }
        observedAt: { type: string, format: date-time }
        fetchedAt: { type: string, format: date-time }
        url: { type: string }
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
        product: { type: string, const: DBZH }
        unit: { type: string, const: dBZ }
        sha256: { type: string }
    RadarManifest:
      type: object
      required: [schemaVersion, generatedAt, attribution, frames]
      properties:
        schemaVersion: { type: integer, const: 1 }
        generatedAt: { type: string, format: date-time }
        attribution:
          {
            type: string,
            const: "Baseret på data fra DMI og efterfølgende bearbejdet",
          }
        frames:
          type: array
          items: { $ref: "#/components/schemas/RadarFrame" }
    NowcastFrame:
      type: object
      required:
        - id
        - predictedAt
        - generatedAt
        - basedOnObservedAt
        - leadMinutes
        - url
        - bounds
        - product
        - unit
        - confidence
        - sha256
      properties:
        id: { type: string }
        predictedAt: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        basedOnObservedAt: { type: string, format: date-time }
        leadMinutes: { type: integer, minimum: 5, maximum: 60 }
        url: { type: string }
        bounds:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
        product: { type: string, const: DBZH_NOWCAST }
        unit: { type: string, const: dBZ }
        confidence: { type: number, minimum: 0, maximum: 1 }
        forecastMethod:
          {
            type: string,
            enum:
              [
                optical-flow,
                persistence,
                trajectory-optical-flow,
                trajectory-speed-corrected,
                regime-adaptive-ensemble,
                probability-gated-ensemble,
                recall-calibrated-ensemble,
              ],
          }
        validationSamples: { type: integer, minimum: 0 }
        verificationCsi: { type: [number, "null"], minimum: 0, maximum: 1 }
        skillOverPersistence:
          { type: [number, "null"], minimum: -1, maximum: 1 }
        sha256: { type: string }
    NowcastManifest:
      type: object
      required:
        - schemaVersion
        - generatedAt
        - attribution
        - method
        - algorithmVersion
        - basedOnObservedAt
        - sourceFrameCount
        - frames
      properties:
        schemaVersion: { type: integer, const: 1 }
        generatedAt: { type: string, format: date-time }
        attribution:
          {
            type: string,
            const: "Baseret på data fra DMI og efterfølgende bearbejdet",
          }
        method:
          {
            type: string,
            enum:
              [
                adaptive-optical-flow-persistence,
                dense-optical-flow-extrapolation,
              ],
          }
        algorithmVersion:
          { type: string, const: adaptive-optical-flow-persistence-v1 }
        basedOnObservedAt: { type: string, format: date-time }
        sourceFrameCount: { type: integer, minimum: 0, maximum: 3 }
        frames:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/NowcastFrame" }
    PushSubscriptionRequest:
      type: object
      required: [subscription, latitude, longitude, locationName, locale]
      properties:
        subscription:
          type: object
          required: [endpoint, keys]
          properties:
            endpoint: { type: string, format: uri, maxLength: 2048 }
            expirationTime: { type: [number, "null"] }
            keys:
              type: object
              required: [auth, p256dh]
              properties:
                auth: { type: string }
                p256dh: { type: string }
        latitude: { type: number, minimum: 54.4, maximum: 58 }
        longitude: { type: number, minimum: 7.5, maximum: 15.5 }
        locationName: { type: string, minLength: 1, maxLength: 80 }
        locale: { type: string, enum: [da, en] }
    ForecastPoint:
      type: object
      required: [step]
      properties:
        step: { type: string, format: date-time }
        temperatureC: { type: [number, "null"] }
        precipitationKgM2: { type: [number, "null"] }
        windSpeedMs: { type: [number, "null"] }
        cloudCoverPercent: { type: [number, "null"] }
    ForecastResponse:
      type: object
      required: [latitude, longitude, fetchedAt, attribution, points]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        fetchedAt: { type: string, format: date-time }
        attribution:
          {
            type: string,
            const: "Baseret på data fra DMI og efterfølgende bearbejdet",
          }
        source: { type: string, enum: [dmi-edr, open-meteo-dmi] }
        model: { type: string, const: "DMI HARMONIE AROME" }
        points:
          type: array
          items: { $ref: "#/components/schemas/ForecastPoint" }
    RainForecastPoint:
      type: object
      required: [startsAt, endsAt, precipitationMm, intensity]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        precipitationMm: { type: number, minimum: 0 }
        intensity: { type: string, enum: [none, trace, light, moderate, heavy] }
        source: { type: string, enum: [radar-nowcast, harmonie] }
        reflectivityDbz: { type: [number, "null"] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        forecastMethod:
          {
            type: [string, "null"],
            enum:
              [
                optical-flow,
                persistence,
                trajectory-optical-flow,
                trajectory-speed-corrected,
                regime-adaptive-ensemble,
                probability-gated-ensemble,
                recall-calibrated-ensemble,
                null,
              ],
          }
    RainEta:
      type: object
      required:
        - status
        - arrivalWindowStart
        - arrivalWindowEnd
        - departureWindowStart
        - departureWindowEnd
        - continuesBeyondHorizon
        - durationMinutes
        - totalPrecipitationMm
        - peakIntensity
        - confidence
        - confidenceLevel
        - source
      properties:
        status:
          {
            type: string,
            enum: [dry, weak-echo, raining, expected, intermittent],
          }
        arrivalWindowStart: { type: [string, "null"], format: date-time }
        arrivalWindowEnd: { type: [string, "null"], format: date-time }
        departureWindowStart: { type: [string, "null"], format: date-time }
        departureWindowEnd: { type: [string, "null"], format: date-time }
        continuesBeyondHorizon: { type: boolean }
        durationMinutes: { type: number, minimum: 0 }
        totalPrecipitationMm: { type: number, minimum: 0 }
        peakIntensity:
          { type: string, enum: [none, trace, light, moderate, heavy] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }
        confidenceLevel: { type: string, enum: [unknown, low, medium, high] }
        source: { type: string, enum: [radar-nowcast, harmonie, mixed] }
    RainNextHourResponse:
      type: object
      required:
        - latitude
        - longitude
        - fetchedAt
        - attribution
        - source
        - model
        - displayResolutionMinutes
        - sourceResolutionMinutes
        - isInterpolated
        - rainEta
        - points
      properties:
        latitude: { type: number }
        longitude: { type: number }
        fetchedAt: { type: string, format: date-time }
        attribution:
          {
            type: string,
            const: "Baseret på data fra DMI og efterfølgende bearbejdet",
          }
        source:
          {
            type: string,
            enum: [dmi-edr, open-meteo-dmi, dmi-radar-nowcast-harmonie],
          }
        model: { type: string, const: "DMI HARMONIE AROME" }
        displayResolutionMinutes: { type: integer, const: 15 }
        sourceResolutionMinutes: { type: integer, const: 60 }
        isInterpolated: { type: boolean, const: true }
        basedOnObservedAt: { type: string, format: date-time }
        radarBasedUntil: { type: string, format: date-time }
        rainEta: { $ref: "#/components/schemas/RainEta" }
        points:
          type: array
          minItems: 1
          maxItems: 4
          items: { $ref: "#/components/schemas/RainForecastPoint" }
    NowcastQuality:
      type: object
      required:
        - schemaVersion
        - generatedAt
        - algorithmVersion
        - thresholdDbz
        - sampleCount
        - meanCriticalSuccessIndex
        - meanCriticalSuccessIndexSkill
        - observatory
        - results
      properties:
        schemaVersion: { type: integer, const: 5 }
        generatedAt: { type: string, format: date-time }
        algorithmVersion: { type: string }
        latestVerifiedAt: { type: [string, "null"], format: date-time }
        thresholdDbz: { type: number, const: 20 }
        thresholdsDbz:
          type: array
          items: { type: number, enum: [5, 10, 15, 20, 35] }
        sampleCount: { type: integer, minimum: 0 }
        totalSampleCount: { type: integer, minimum: 0 }
        returnedResultCount: { type: integer, minimum: 0, maximum: 288 }
        meanCriticalSuccessIndex:
          { type: [number, "null"], minimum: 0, maximum: 1 }
        meanCriticalSuccessIndexSkill:
          { type: [number, "null"], minimum: -1, maximum: 1 }
        byLeadMinutes:
          type: array
          maxItems: 12
          items:
            allOf:
              - $ref: "#/components/schemas/VerificationSummary"
              - type: object
                required: [leadMinutes]
                properties:
                  leadMinutes: { type: integer, minimum: 5, maximum: 60 }
                  byForecastMethod:
                    type: array
                    maxItems: 7
                    items:
                      allOf:
                        - $ref: "#/components/schemas/VerificationSummary"
                        - type: object
                          required: [forecastMethod]
                          properties:
                            forecastMethod:
                              {
                                type: string,
                                enum:
                                  [
                                    optical-flow,
                                    persistence,
                                    trajectory-optical-flow,
                                    trajectory-speed-corrected,
                                    regime-adaptive-ensemble,
                                    probability-gated-ensemble,
                                    recall-calibrated-ensemble,
                                  ],
                              }
        byThresholdDbz:
          type: array
          maxItems: 5
          items:
            allOf:
              - $ref: "#/components/schemas/VerificationSummary"
              - type: object
                required: [thresholdDbz]
                properties:
                  thresholdDbz: { type: number, enum: [5, 10, 15, 20, 35] }
        byAlgorithmVersion:
          type: array
          items:
            type: object
            required: [algorithmVersion, latestVerifiedAt, sampleCount]
            properties:
              algorithmVersion: { type: string }
              latestVerifiedAt: { type: string, format: date-time }
              sampleCount: { type: integer, minimum: 0 }
        observatory: { $ref: "#/components/schemas/PrecisionObservatory" }
        observatoryByThresholdDbz:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/PrecisionObservatory" }
        shadowCandidates:
          type: array
          items: { $ref: "#/components/schemas/ShadowCandidateQuality" }
        groundGauge: { $ref: "#/components/schemas/GroundGaugeQuality" }
        geographicConsistency:
          { $ref: "#/components/schemas/GeographicConsistencyQuality" }
        results:
          type: array
          maxItems: 288
          items:
            type: object
            required:
              - verifiedAt
              - basedOnObservedAt
              - predictedAt
              - observedAt
              - leadMinutes
              - algorithmVersion
              - thresholdDbz
              - validPixels
              - hits
              - misses
              - falseAlarms
              - correctNegatives
              - precision
              - recall
              - criticalSuccessIndex
              - persistenceCriticalSuccessIndex
              - criticalSuccessIndexSkill
              - dbzMeanAbsoluteError
            properties:
              verifiedAt: { type: string, format: date-time }
              basedOnObservedAt: { type: string, format: date-time }
              predictedAt: { type: string, format: date-time }
              observedAt: { type: string, format: date-time }
              leadMinutes: { type: integer, minimum: 5, maximum: 60 }
              algorithmVersion: { type: string }
              thresholdDbz: { type: number, const: 20 }
              validPixels: { type: integer, minimum: 0 }
              hits: { type: integer, minimum: 0 }
              misses: { type: integer, minimum: 0 }
              falseAlarms: { type: integer, minimum: 0 }
              correctNegatives: { type: integer, minimum: 0 }
              precision: { type: [number, "null"], minimum: 0, maximum: 1 }
              recall: { type: [number, "null"], minimum: 0, maximum: 1 }
              criticalSuccessIndex:
                { type: [number, "null"], minimum: 0, maximum: 1 }
              persistenceCriticalSuccessIndex:
                { type: [number, "null"], minimum: 0, maximum: 1 }
              criticalSuccessIndexSkill:
                { type: [number, "null"], minimum: -1, maximum: 1 }
              dbzMeanAbsoluteError: { type: number, minimum: 0 }
              forecastMethod:
                {
                  type: string,
                  enum:
                    [
                      optical-flow,
                      persistence,
                      trajectory-optical-flow,
                      trajectory-speed-corrected,
                      regime-adaptive-ensemble,
                      probability-gated-ensemble,
                      recall-calibrated-ensemble,
                    ],
                }
              thresholdScores:
                type: array
                maxItems: 5
                items:
                  { $ref: "#/components/schemas/VerificationThresholdScore" }
    PrecisionObservatoryResponse:
      type: object
      required:
        - schemaVersion
        - generatedAt
        - latestVerifiedAt
        - algorithmVersion
        - thresholdDbz
        - sampleCount
        - totalSampleCount
        - observatory
      properties:
        schemaVersion: { type: integer, minimum: 5 }
        generatedAt: { type: string, format: date-time }
        latestVerifiedAt: { type: [string, "null"], format: date-time }
        algorithmVersion: { type: string }
        thresholdDbz: { type: number, const: 20 }
        sampleCount: { type: integer, minimum: 0 }
        totalSampleCount: { type: integer, minimum: 0 }
        observatory: { $ref: "#/components/schemas/PrecisionObservatory" }
        shadowCandidates:
          type: array
          items: { $ref: "#/components/schemas/ShadowCandidateQuality" }
        groundGauge: { $ref: "#/components/schemas/GroundGaugeQuality" }
        geographicConsistency:
          { $ref: "#/components/schemas/GeographicConsistencyQuality" }
    ShadowCandidateQuality:
      type: object
      required:
        - candidateId
        - forecastMethod
        - minimumLeadMinutes
        - promotionGate
        - safeToPromoteLeadMinutes
        - byLeadMinutes
      properties:
        candidateId:
          {
            type: string,
            enum:
              [
                trajectory-recency-flow-v1,
                trajectory-speed-bias-v2,
                regime-adaptive-ensemble-v3,
                probability-gated-ensemble-v4,
                recall-calibrated-ensemble-v5,
              ],
          }
        forecastMethod:
          {
            type: string,
            enum:
              [
                trajectory-optical-flow,
                trajectory-speed-corrected,
                regime-adaptive-ensemble,
                probability-gated-ensemble,
                recall-calibrated-ensemble,
              ],
          }
        minimumLeadMinutes: { type: integer, const: 40 }
        promotionGate:
          type: object
          required:
            - minimumSamples
            - minimumEventPixels
            - minimumCriticalSuccessIndex
            - minimumCriticalSuccessIndexImprovement
            - minimumSkillOverPersistence
            - maximumFalseAlarmRateIncrease
          properties:
            minimumSamples: { type: integer, minimum: 1 }
            minimumEventPixels: { type: integer, minimum: 1 }
            minimumCriticalSuccessIndex:
              { type: number, minimum: 0, maximum: 1 }
            minimumCriticalSuccessIndexImprovement:
              { type: number, minimum: 0, maximum: 1 }
            minimumSkillOverPersistence:
              { type: number, minimum: -1, maximum: 1 }
            maximumFalseAlarmRateIncrease:
              { type: number, minimum: -1, maximum: 1 }
            minimumBrierSkillOverPersistence:
              { type: [number, "null"], minimum: -1, maximum: 1 }
            minimumCalibratedRecallRetention:
              { type: number, minimum: 0, maximum: 1 }
            minimumCalibratedAbsoluteRecall:
              { type: number, minimum: 0, maximum: 1 }
        safeToPromoteLeadMinutes:
          type: array
          maxItems: 4
          items: { type: integer, enum: [40, 45, 50, 55, 60] }
        byLeadMinutes:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/ShadowCandidateLeadQuality" }
    ShadowCandidateLeadQuality:
      allOf:
        - $ref: "#/components/schemas/VerificationSummary"
        - type: object
          required:
            - leadMinutes
            - status
            - safeToPromote
            - eventPixelCount
            - falseAlarmRate
            - baselineFalseAlarmRate
            - falseAlarmRateIncrease
            - baselineCriticalSuccessIndex
            - criticalSuccessIndexImprovement
          properties:
            leadMinutes: { type: integer, enum: [40, 45, 50, 55, 60] }
            status:
              {
                type: string,
                enum: [collecting, awaiting-rain, promotable, held-back],
              }
            safeToPromote: { type: boolean }
            eventPixelCount: { type: integer, minimum: 0 }
            falseAlarmRate: { type: [number, "null"], minimum: 0, maximum: 1 }
            baselineFalseAlarmRate:
              { type: [number, "null"], minimum: 0, maximum: 1 }
            falseAlarmRateIncrease:
              { type: [number, "null"], minimum: -1, maximum: 1 }
            baselineCriticalSuccessIndex:
              { type: [number, "null"], minimum: 0, maximum: 1 }
            criticalSuccessIndexImprovement:
              { type: [number, "null"], minimum: -1, maximum: 1 }
            minimumRainProbability:
              { type: [number, "null"], minimum: 0, maximum: 1 }
            probabilityCalibration:
              { $ref: "#/components/schemas/ProbabilityCalibrationQuality" }
    ProbabilityCalibrationQuality:
      type: object
      required:
        - policyVersion
        - status
        - sampleCount
        - eventPixelCount
        - minimumSamples
        - minimumEventPixels
        - minimumAbsoluteRecall
        - minimumRecallRetention
        - minimumCriticalSuccessIndexGain
        - unfilteredRecall
        - recallFloor
        - unfilteredCriticalSuccessIndex
        - selectedMinimumRainProbability
        - selectedCriticalSuccessIndex
        - byMinimumRainProbability
      properties:
        policyVersion: { type: string }
